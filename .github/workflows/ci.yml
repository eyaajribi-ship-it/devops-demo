name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/docker" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances et lancer les tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover || echo "No tests configured yet"

      - name: Se connecter au registre GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image Docker vers le registre
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_LOWER:${{ github.sha }} -t $IMAGE_LOWER:latest .
          docker push $IMAGE_LOWER:${{ github.sha }}
          docker push $IMAGE_LOWER:latest
