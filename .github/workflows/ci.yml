name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Tests du back-end
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Compilation du front-end
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Construction de l'image Docker
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tounestrip
          docker build -t $IMAGE:${GITHUB_SHA::7} -t $IMAGE:latest .

      - name: Connexion à GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image sur GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tounestrip
          docker push $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
