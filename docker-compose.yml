# Lancement local : construit l'image à partir du code source.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tounestrip
      POSTGRES_PASSWORD: tounestrip
      POSTGRES_DB: tounestrip
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tounestrip"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://tounestrip:tounestrip@db:5432/tounestrip
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-changer}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
